spring.application.name=Emkopo-Management
server.port=8087

spring.profiles.active=dev
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.driver-class-name: org.postgresql.Driver

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle: true
spring.datasource.validationQuery: SELECT 1

# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql: true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
spring.jpa.hibernate.ddl-auto: update

# Allows Hibernate to generate SQL optimized for a particular DBMS
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone: UTC
#i need to edit table tab_product atraibutre created_by_username

# Other configurations
logging.level.com.dflex.emkopo=INFO
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB

#Upload file
spring.servlet.multipart.max-file-size=17MB
spring.servlet.multipart.max-request-size=17MB
server.servlet.session.timeout=5m

# UTUMISHI PUBLIC KEY CONFIG
dflex.public.key.path=/root/emkopo/esstraining.crt

#Default index page
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

